name: Precure verify

on:
  push:
    paths:
      - 'docs/precure-vn-alignment/**'
      - '.github/workflows/precure-verify.yml'
  pull_request:
    paths:
      - 'docs/precure-vn-alignment/**'

jobs:
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r docs/precure-vn-alignment/research/analysis/requirements.txt
      - run: bash docs/precure-vn-alignment/research/analysis/verify.sh
